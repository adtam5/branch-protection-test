name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  merge_group:

env:
  CI: true

jobs:
  qa-test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'do not build') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore pnpm cache
        id: restore-cached-node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/node_modules
            !**/node_modules/.vite
          key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome CI checks for pull request
        if: github.event_name == 'pull_request'
        run: pnpm biome ci --no-errors-on-unmatched --reporter=github --reporter=default --changed --since=origin/${{ github.base_ref }}

      - name: Run Biome CI checks for push to main or merge queue
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        run: pnpm biome ci --no-errors-on-unmatched --reporter=github --reporter=default
